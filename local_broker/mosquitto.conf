# Local MQTT broker on the UNO Q (Mosquitto in Docker), for the ping-pong
# game's fast topics: swing events (UNO Q -> laptop) and game state
# (laptop -> UNO Q LED matrix). Everything stays on the local WiFi instead of
# going to broker.hivemq.com (Frankfurt) and back.
# Start / restart it with:  sh /home/arduino/ArduinoApps/local_broker/start_broker.sh

listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_type error
log_type warning
log_type notice

# Bridge ME193/CeciLaBarge/# both ways to the public broker, so a client that
# fell back to hivemq still sees messages published here (and the other way
# round). The record topic ME193/Rogers/... is NOT bridged: it stays on hivemq.
connection hivemq
address broker.hivemq.com:1883
remote_clientid AirFour-ME193-local-bridge
bridge_protocol_version mqttv50
topic ME193/CeciLaBarge/# both 0
cleansession true
start_type automatic
restart_timeout 2 30
notifications false
try_private false
